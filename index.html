<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Roberto Peluqueros byPerfil - Salón de belleza profesional y minimalista.">
    <title>Roberto Peluqueros byPerfil</title>

    <!-- Google Fonts: Playfair Display for headings (Luxury), Inter for body (Clean) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        black: '#0a0a0a',
                        white: '#ffffff',
                        gray: {
                            100: '#f5f5f5',
                            200: '#e5e5e5',
                            300: '#d4d4d4',
                            400: '#a3a3a3',
                            500: '#737373',
                            800: '#262626',
                            900: '#171717',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom basic styles for smooth animations */
        body {
            background-color: #ffffff;
            color: #0a0a0a;
            -webkit-font-smoothing: antialiased;
        }
        
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
    </style>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="font-sans antialiased selection:bg-black selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        // --- React Hooks ---
        const { useState, useEffect } = React;

        // --- Icons Component helper ---
        // Generates an i tag with data-lucide attribute, which Lucide will replace
        const Icon = ({ name, className = "" }) => {
            return <i data-lucide={name} className={className}></i>;
        };

        // --- Components ---

        const Navbar = () => {
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setIsScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed w-full z-50 transition-all duration-300 ${isScrolled ? 'bg-white/90 backdrop-blur-md border-b border-gray-200 py-4' : 'bg-transparent py-6'}`}>
                    <div className="container mx-auto px-6 md:px-12 flex justify-between items-center">
                        <a href="#" className={`font-serif text-2xl font-bold tracking-tight ${isScrolled ? 'text-black' : 'text-white drop-shadow-md'}`}>
                            byPerfil
                        </a>
                        <div className="hidden md:flex space-x-8">
                            {['Servicios', 'Hombre', 'Equipo', 'Reservar'].map((item) => (
                                <a key={item} href={`#${item.toLowerCase()}`} className={`text-sm tracking-widest uppercase transition-colors hover:opacity-70 ${isScrolled ? 'text-black font-medium' : 'text-white font-medium drop-shadow-md'}`}>
                                    {item}
                                </a>
                            ))}
                        </div>
                        <a href="#reservar" className={`hidden md:block px-6 py-2 border transition-all duration-300 ${isScrolled ? 'border-black text-black hover:bg-black hover:text-white' : 'border-white text-white hover:bg-white hover:text-black font-medium'}`}>
                            Agendar
                        </a>
                        <button className={`md:hidden ${isScrolled ? 'text-black' : 'text-white'}`}>
                            <Icon name="menu" className="w-6 h-6" />
                        </button>
                    </div>
                </nav>
            );
        };

        const Hero = () => {
            return (
                <section className="relative h-screen flex items-center justify-center overflow-hidden">
                    {/* Background Image - Users can replace this URL */}
                    <div className="absolute inset-0 z-0">
                        <div className="absolute inset-0 bg-black/40 z-10"></div>
                        <img 
                            src="https://images.unsplash.com/photo-1560066984-138dadb4c035?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" 
                            alt="Interior de peluquería elegante" 
                            className="w-full h-full object-cover"
                        />
                    </div>
                    
                    <div className="relative z-10 text-center text-white px-6 w-full max-w-4xl fade-in-up mt-24 md:mt-32">

                        <h1 className="font-serif text-5xl md:text-7xl lg:text-8xl font-bold mb-6 leading-tight">
                            Roberto Peluqueros <br/>
                            <span className="font-light italic text-4xl md:text-6xl">byPerfil</span>
                        </h1>
                        <p className="max-w-xl mx-auto text-lg md:text-xl font-light mb-10 opacity-90">
                            La excelencia en el cuidado de tu imagen. Una experiencia de lujo, minimalismo y profesionalidad.
                        </p>
                        <a href="#reservar" className="inline-block bg-white text-black px-10 py-4 uppercase tracking-widest text-sm font-semibold hover:bg-black hover:text-white hover:border-white border border-transparent transition-all duration-300">
                            Reservar Ahora
                        </a>
                    </div>
                </section>
            );
        };

        const ServicesWomen = () => {
            const services = [
                {
                    title: "Uñas",
                    icon: "sparkles",
                    items: [
                        { name: "Uñas Nuevas (Gel/Acrílico)", price: "desde 45€" },
                        { name: "Mantenimiento y Cambio", price: "desde 30€" },
                        { name: "Manicura Tradicional", price: "15€" },
                        { name: "Nail Art Técnico", price: "+5€" },
                    ]
                },
                {
                    title: "Cabello",
                    icon: "scissors",
                    items: [
                        { name: "Corte de Diseño", price: "desde 25€" },
                        { name: "Coloración / Tintes", price: "desde 40€" },
                        { name: "Mechas / Balayage", price: "desde 75€" },
                        { name: "Peinados y Recogidos", price: "desde 35€" },
                        { name: "Tratamientos Capilares", price: "desde 20€" },
                    ]
                }
            ];

            return (
                <section id="servicios" className="py-24 md:py-32 bg-white text-black">
                    <div className="container mx-auto px-6 md:px-12">
                        <div className="text-center mb-16 md:mb-24 fade-in-up">
                            <h2 className="font-serif text-4xl md:text-5xl font-bold mb-4">Servicios Mujer</h2>
                            <div className="w-16 h-0.5 bg-black mx-auto"></div>
                        </div>

                        <div className="grid md:grid-cols-2 gap-16 lg:gap-24">
                            {services.map((category, idx) => (
                                <div key={idx} className="fade-in-up delay-100">
                                    <div className="flex items-center mb-8 border-b border-gray-200 pb-4">
                                        <Icon name={category.icon} className="w-6 h-6 mr-4" />
                                        <h3 className="font-serif text-3xl font-medium">{category.title}</h3>
                                    </div>
                                    <ul className="space-y-6">
                                        {category.items.map((item, idy) => (
                                            <li key={idy} className="flex justify-between items-baseline group cursor-pointer hover:px-2 transition-all duration-300">
                                                <span className="text-lg text-gray-800">{item.name}</span>
                                                <div className="flex-1 mx-4 border-b border-dashed border-gray-300 relative top-[-6px] group-hover:border-black transition-colors"></div>
                                                <span className="font-semibold">{item.price}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const ServicesMen = () => {
            const services = [
                { name: "Corte Clásico / Fade", price: "desde 18€" },
                { name: "Arreglo de Barba Ritual", price: "desde 12€" },
                { name: "Tinte / Cobertura de Canas", price: "desde 25€" },
                { name: "Peinado y Styling", price: "desde 10€" },
            ];

            return (
                <section id="hombre" className="py-24 md:py-32 bg-black text-white">
                    <div className="container mx-auto px-6 md:px-12">
                        <div className="flex flex-col md:flex-row items-center justify-between gap-12">
                            <div className="w-full md:w-1/2 fade-in-up">
                                <h2 className="font-serif text-4xl md:text-5xl font-bold mb-4">Servicios Hombre</h2>
                                <div className="w-16 h-0.5 bg-white mb-10"></div>
                                <p className="text-gray-300 font-light text-lg mb-10">
                                    Un espacio dedicado al cuidado masculino, fusionando técnicas clásicas de barbería con las últimas tendencias en estilismo.
                                </p>
                                
                                <ul className="space-y-6">
                                    {services.map((item, idx) => (
                                        <li key={idx} className="flex justify-between items-baseline group cursor-pointer hover:px-2 transition-all duration-300">
                                            <span className="text-lg text-gray-200">{item.name}</span>
                                            <div className="flex-1 mx-4 border-b border-dashed border-gray-700 relative top-[-6px] group-hover:border-white transition-colors"></div>
                                            <span className="font-semibold">{item.price}</span>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                            <div className="w-full md:w-1/2 fade-in-up delay-200">
                                <div className="relative h-[600px] w-full overflow-hidden">
                                     {/* Users can replace this URL with a barber/men grooming photo */}
                                    <img 
                                        src="https://images.unsplash.com/photo-1599351431202-1e0f0137899a?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
                                        alt="Corte de hombre profesional" 
                                        className="absolute inset-0 w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-700"
                                    />
                                    <div className="absolute inset-0 ring-1 ring-inset ring-black/10"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Team = () => {
            const members = [
                { name: "Laura", role: "Especialista en Uñas", img: "https://images.unsplash.com/photo-1595152772835-219674b2a8a6?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" },
                { name: "Sofía", role: "Especialista en Uñas", img: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" },
                { name: "Roberto", role: "Estilista / Corte", img: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" },
                { name: "Carlos", role: "Estilista / Corte", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" },
                { name: "María", role: "Estilista / Color", img: "https://images.unsplash.com/photo-1605993439219-9d09d2020fa5?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" },
                { name: "Elena", role: "Estilista / Corte", img: "https://images.unsplash.com/photo-1580489944761-15a19d654956?ixlib=rb-4.0.3&auto=format&fit=crop&w=500&q=80" },
            ];

            return (
                <section id="equipo" className="py-24 md:py-32 bg-gray-50 text-black">
                    <div className="container mx-auto px-6 md:px-12">
                        <div className="text-center mb-16 md:mb-24 fade-in-up">
                            <h2 className="font-serif text-4xl md:text-5xl font-bold mb-4">Nuestro Equipo</h2>
                            <div className="w-16 h-0.5 bg-black mx-auto mb-6"></div>
                            <p className="text-gray-600 max-w-2xl mx-auto">Profesionales apasionados por sacar tu mejor versión.</p>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                            {members.map((member, idx) => (
                                <div key={idx} className="group cursor-pointer fade-in-up" style={{ animationDelay: `${(idx % 3) * 100}ms` }}>
                                    <div className="relative aspect-[4/5] overflow-hidden bg-gray-200 mb-6">
                                        <img 
                                            src={member.img} 
                                            alt={member.name}
                                            className="object-cover w-full h-full grayscale group-hover:grayscale-0 transition-all duration-700 ease-in-out transform group-hover:scale-105"
                                        />
                                        <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                                    </div>
                                    <div className="text-center">
                                        <h3 className="font-serif text-2xl font-medium mb-1">{member.name}</h3>
                                        <p className="text-sm tracking-widest uppercase text-gray-500">{member.role}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const Schedule = () => {
            return (
                <section className="py-24 bg-white border-b border-gray-100">
                    <div className="container mx-auto px-6 md:px-12">
                        <div className="max-w-4xl mx-auto bg-black text-white p-12 md:p-16 flex flex-col md:flex-row justify-between items-center gap-10 fade-in-up">
                            <div className="text-center md:text-left">
                                <Icon name="clock" className="w-8 h-8 mb-6 mx-auto md:mx-0 text-white" />
                                <h3 className="font-serif text-3xl font-bold mb-2">Horarios de Atención</h3>
                                <p className="text-gray-400">Siempre listos para recibirte.</p>
                            </div>
                            <div className="flex-1 w-full space-y-4">
                                <div className="flex justify-between items-center border-b border-gray-800 pb-4">
                                    <span className="text-lg font-medium">Lunes a Viernes</span>
                                    <div className="text-right">
                                        <span className="block text-gray-300">09:00 - 14:00</span>
                                        <span className="block text-gray-300">17:00 - 20:00</span>
                                    </div>
                                </div>
                                <div className="flex justify-between items-center pt-2">
                                    <span className="text-lg font-medium">Sábados</span>
                                    <span className="text-gray-300">09:00 - 15:00<br/><span className="text-xs text-gray-500 uppercase tracking-wider block mt-1">(Solo bajo cita previa)</span></span>
                                </div>
                                <div className="flex justify-between items-center pt-4 text-gray-500">
                                    <span className="text-base">Domingos</span>
                                    <span>Cerrado</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const Appointments = () => {
            useEffect(() => {
                const script = document.createElement('script');
                script.src = "https://link.msgsndr.com/js/form_embed.js";
                script.type = "text/javascript";
                script.async = true;
                document.body.appendChild(script);
                return () => {
                    document.body.removeChild(script);
                };
            }, []);

            return (
                <section id="reservar" className="py-24 md:py-32 bg-gray-50 text-center">
                    <div className="container mx-auto px-6 md:px-12 max-w-4xl fade-in-up">
                        <Icon name="calendar-check" className="w-12 h-12 mx-auto mb-6 text-black" />
                        <h2 className="font-serif text-4xl md:text-5xl font-bold mb-6">Agenda tu cita aquí</h2>
                        <p className="text-gray-600 mb-10 text-lg">
                            Reserva tu momento de cuidado personal. Selecciona el servicio, el profesional y la hora que mejor se adapte a ti.
                        </p>
                        
                        <div className="bg-white p-2 md:p-6 border border-gray-200 shadow-sm rounded-xl overflow-hidden min-h-[600px] w-full">
                            <iframe 
                                src="https://api.leadconnectorhq.com/widget/service-menu/69c1755405ade811323fd75f" 
                                style={{ width: "100%", border: "none", overflow: "hidden", minHeight: "600px" }} 
                                scrolling="no" 
                                id="69c1755405ade811323fd75f_1774286170420"
                            ></iframe>
                        </div>
                    </div>
                </section>
            );
        };

        const WhatsAppButton = () => {
            return (
                <a 
                    href="https://wa.me/34671736406"
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="fixed bottom-6 right-6 z-50 bg-[#25D366] text-white p-4 rounded-full shadow-lg hover:bg-black hover:scale-110 transition-all duration-300 flex items-center justify-center group"
                    aria-label="Contactar por WhatsApp"
                >
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" className="w-7 h-7">
                        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413Z"/>
                    </svg>
                    <span className="absolute right-full mr-4 bg-black text-white px-3 py-1.5 text-xs font-semibold rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none">
                        ¡Escríbenos!
                    </span>
                </a>
            );
        };

        const Footer = () => {
            return (
                <footer className="bg-black text-white pt-20 pb-10">
                    <div className="container mx-auto px-6 md:px-12">
                        <div className="grid md:grid-cols-3 gap-12 mb-16">
                            <div>
                                <h3 className="font-serif text-2xl font-bold mb-6">Roberto Peluqueros <br/><span className="font-light italic text-xl">byPerfil</span></h3>
                                <p className="text-gray-400 font-light max-w-xs">
                                    Redefiniendo el cuidado personal con elegancia, técnica y un ambiente exclusivo.
                                </p>
                            </div>
                            <div>
                                <h4 className="font-medium text-lg mb-6 uppercase tracking-widest">Contacto</h4>
                                <ul className="space-y-4 text-gray-400 font-light">
                                    <li className="flex items-start">
                                        <Icon name="map-pin" className="w-5 h-5 mr-3 mt-0.5 flex-shrink-0" />
                                        <span>Calle Dr. Nacher, 60, Bajo<br/>Chiva, Valencia</span>
                                    </li>
                                    <li className="flex items-center">
                                        <Icon name="phone" className="w-5 h-5 mr-3 flex-shrink-0" />
                                        <span>671 73 64 06</span>
                                    </li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="font-medium text-lg mb-6 uppercase tracking-widest">Síguenos</h4>
                                <a 
                                    href="https://www.instagram.com/robertopeluquerosbyperfil/?hl=es" 
                                    target="_blank" 
                                    rel="noopener noreferrer"
                                    className="inline-flex items-center text-gray-400 hover:text-white transition-colors group"
                                >
                                    <div className="p-3 border border-gray-700 rounded-full mr-4 group-hover:border-white transition-colors">
                                        <Icon name="instagram" className="w-5 h-5" />
                                    </div>
                                    <span className="font-light">@robertopeluquerosbyperfil</span>
                                </a>
                            </div>
                        </div>
                        <div className="border-t border-gray-800 pt-8 flex flex-col md:flex-row justify-between items-center text-sm text-gray-500">
                            <p>&copy; {new Date().getFullYear()} Roberto Peluqueros byPerfil. Todos los derechos reservados.</p>
                            <div className="mt-4 md:mt-0 space-x-4">
                                <a href="#" className="hover:text-white transition-colors">Aviso Legal</a>
                                <a href="#" className="hover:text-white transition-colors">Privacidad</a>
                            </div>
                        </div>
                    </div>
                </footer>
            );
        };

        const App = () => {
            // Initialize Lucide icons after render
            useEffect(() => {
                lucide.createIcons();
            });

            return (
                <div className="min-h-screen bg-white text-black selection:bg-black selection:text-white">
                    <Navbar />
                    <Hero />
                    <ServicesWomen />
                    <ServicesMen />
                    <Schedule />
                    <Team />
                    <Appointments />
                    <Footer />
                    <WhatsAppButton />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
